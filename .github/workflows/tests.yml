name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Smoke test deployed MCP authentication
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://duamorpaper-button-renderer-mcp.onrender.com"
          curl --retry 2 --retry-delay 5 --retry-all-errors -fsS "$BASE_URL/healthz"
          STATUS=$(curl -sS -o /tmp/mcp-smoke.json -w "%{http_code}" -X POST "$BASE_URL/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}')
          if [ "$STATUS" != "401" ]; then
            cat /tmp/mcp-smoke.json
            echo "Expected unauthenticated MCP request to return 401, got $STATUS. Check MCP_API_KEY and deployed revision."
            exit 1
          fi
          echo "MCP endpoint is reachable and correctly rejects requests without credentials."
