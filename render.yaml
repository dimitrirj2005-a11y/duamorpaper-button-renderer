services:
  - type: web
    name: duamorpaper-button-renderer-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://duamorpaper-button-renderer-mcp.onrender.com
      - key: OAUTH_SIGNING_SECRET
        generateValue: true
      - key: OAUTH_LOGIN_USERNAME
        value: duamorpaper
      - key: OAUTH_LOGIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://chatgpt.com,https://chat.openai.com
